name: MVP verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare sandbox image
        run: docker pull python:3.12-alpine

      - name: Run contracts and Docker sandbox verification
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          RUN_DOCKER_SANDBOX_TESTS: '1'
        run: python3 -m unittest discover -s tests -v
